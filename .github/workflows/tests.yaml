name: Unit Tests

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

# `pull-requests: write` is needed in addition to `checks: write`: the test reporter creates the
# check run with the latter and then looks up the PR with the former. Do not add a job-level
# `permissions:` block; it REPLACES this one and every scope it omits becomes `none`.
permissions:
  checks: write
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # One job, one install: every check runs in sequence on the same checkout.
  ci:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 -- the version step needs the full history and tags.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci

      - run: npm run lint
      - run: npm run build

      # vitest.config.ts switches on the junit reporter when CI is set and writes ./junit.xml
      - name: Unit tests (Node 22)
        run: npm run test:coverage
        env:
          CI: "true"

      - name: Publish test report
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: success() || failure()
        with:
          files: junit.xml
          check_name: unit test report

      # Packs the library and runs deliberately failing specs in Jest, Vitest, node:test,
      # mocha + chai and Playwright, checking how the failures show up in the terminal output and
      # the JUnit XML.
      - name: Framework examples
        run: npm run test:examples

      # The published files must resolve correctly from CJS and ESM, with types.
      - name: Package checks (publint, arethetypeswrong)
        run: npm run check:package

      # The same GitVersion + stamp steps the publish workflow runs, so a broken versioning setup
      # shows up on a PR rather than on release day.
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      # GitVersion.yml is 6.x schema; v5 aborts on it.
      - run: dotnet tool install --global GitVersion.Tool --version 6.8.2
      - name: Generate and stamp the version
        run: |
          bash ./scripts/version/generateVersion.sh
          bash ./scripts/version/updateVersion.sh
      - name: Stamped version is valid semver
        run: |
          version="$(node -p "require('./package.json').version")"
          echo "version: $version"
          echo "$version" | grep -E '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'

      # Same install and build, other Node versions: newest, then the oldest the package claims.
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
      - name: Unit tests (Node 24)
        run: npm test
      - uses: actions/setup-node@v4
        with:
          node-version: 18.x
      - name: Smoke test the built package (Node 18)
        run: npm run smoke

      # continue-on-error so a quota failure on the upload can never fail a green run
      - name: Upload reports
        uses: actions/upload-artifact@v4
        continue-on-error: true
        if: success() || failure()
        with:
          name: test-reports
          path: |
            junit.xml
            coverage
            examples/_reports
          retention-days: 1
